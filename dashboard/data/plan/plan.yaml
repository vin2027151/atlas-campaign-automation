# Next month's paid build, as data. Edit this file; nothing else.
# Every number traces to plan-final.md (findings F1-F7, section 2).
# Budgets are MONTHLY dollars. Daily budgets are derived (monthly / days_in_month).

account:
  name: "Search Atlas"          # company and brand (B2B SaaS, trial signup)
  offering: "AgentStack"        # the offering this plan sells: its own ads, landing page, 14-day trial
  month: "2026-11"
  days_in_month: 30
  landing_url: "https://www.agentstack.example/trial"
  display_url: "agentstack.example"
  total_budget: 120000          # brief: ~$120K/month
  cpa_band: [250, 280]          # brief: trial CPA target $250-280
  campaign_cpa_ceiling: 350     # no single campaign may target/cap above this
  reserve: 7000                 # held back, released week 3 (section 2)

# Vin's preconditions (2026-11-05 review). The build ships paused until these
# are true; the data in the five tabs is not trusted enough to skip them.
preconditions:
  - "Meta StartTrial event re-verified against PostHog daily (broke 2026-09-22, signup flow v3)"
  - "UK conversion tag and PostHog verified under the UK consent banner before UK spends a dollar"
  - "Dynamic UTMs on every keyword, ad, placement, landing page, CTA and offer, flowing into the CRM"
  - "Trial-to-paid and LTV joined back to campaign and keyword; per-offering CPA targets replace the flat band when known"
  - "Bot / invalid-traffic exclusion confirmed on every optimization event"
  - "Legacy Meta campaigns (corrupt post-09-22 data) run one week beside the relaunch; budget moves only once the clean campaigns match them"

platforms:
  meta:
    declared_total: 60000       # must equal the sum of meta campaign budgets
    ceiling: 65000              # brief: ~$65K Meta
    conversion_event: "StartTrial"
    pixel_id: "PIXEL_ID_HERE"
    page_id: "PAGE_ID_HERE"
  google:
    declared_total: 53000       # must equal the sum of google campaign budgets
    ceiling: 55000              # brief: ~$55K Google

# Entities deliberately removed. The validator refuses to build if any of these
# reappear as a campaign, ad set, ad group, ad or shared budget name.
cut:
  - "Google_Main_Shared"        # F3: one shared budget cut the US 30.9%
  # Search_NonBrand_UK is NOT cut (Vin, 2026-11-05): zero conversions from
  # 4,944 clicks at a normal CTR reads as a tracking fault, not a market
  # verdict. It is rebuilt below on its own budget, behind a tracking check.

