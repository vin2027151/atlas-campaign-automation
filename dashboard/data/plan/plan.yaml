# ------------------------------------------------------------- Meta campaigns
# One ad set per campaign. Budget sits on the AD SET, and each campaign has
# exactly one, so no campaign shares a budget with another (F3).
# Age floor 27 on prospecting (Vin): the $99/mo agency buyer is not 18-26; the
# data has no age breakdown, so this is product knowledge, not a finding.
# Every prospecting ad is direct response with a sign-up CTA; no branding plays
# in acquisition.
meta_campaigns:
  - name: "Prospecting_Core"
    objective: "OUTCOME_LEADS"
    budget: 45000               # the four proven ads, +8% on their own run-rate
    expected_cpa: 265           # central case, F5 blend
    cap: 300                    # 7-day true-CPA trigger introduces a $300 cap
    unproven_slot: false
    launch_at_pct: 70           # steps to 100% within 48h of the event fix (F1)
    ad_set:
      name: "US_AdvantagePlus_27plus"
      optimization_goal: "OFFSITE_CONVERSIONS"
      bid_strategy: "LOWEST_COST_WITHOUT_CAP"
      countries: ["US"]
      age_min: 27
      age_max: 65
      gender: "All"
      audience: "Advantage+ Audience (no interest stacking)"
      excluded_audiences: ["Customers_All", "Trial_Starters_90d"]
    ads:
      - "UGC_Founder_v2"        # F6: never deleted; scaled, not paused (Vin)
      - "UGC_Agency_Owner"
      - "Static_AgentStack_Benefits"
      - "Demo_Screen_Walkthrough"

  - name: "Prospecting_Test"
    objective: "OUTCOME_LEADS"
    budget: 9000
    expected_cpa: 300
    cap: 330
    unproven_slot: true
    test_slots: 3               # Vin: one-at-a-time is too slow at $100K/mo; three hooks concurrently
    ad_set:
      name: "US_AdvantagePlus_Test_27plus"
      optimization_goal: "OFFSITE_CONVERSIONS"
      bid_strategy: "LOWEST_COST_WITHOUT_CAP"
      countries: ["US"]
      age_min: 27
      age_max: 65
      gender: "All"
      audience: "Advantage+ Audience (no interest stacking)"
      excluded_audiences: ["Customers_All", "Trial_Starters_90d"]
    ads:
      - "UGC_Founder_v3"
      - "UGC_Agency_WhiteLabel_Hook"
      - "UGC_Solo_Owner_Hook"
    queue:                      # next occupants; one new hook or offer per slot as one retires
      - "Offer_Variant_TBD_1"
      - "Service_Specific_TBD_1"

  # Retargeting (Vin): no cost cap on people already paid for in acquisition.
  # Budget and audience do the limiting. Segmented by the pages visited, because
  # an agency reading white-label pricing and a solo owner on the trial page do
  # not get the same message. Days 1-14 and 15-30 are different conversations.
  - name: "Retargeting_Agency_14d"
    objective: "OUTCOME_LEADS"
    budget: 2500
    expected_cpa: 330
    unproven_slot: false
    allow_unproven_without_slot: true   # declared exception to rule 7 (challengers vs control)
    ad_set:
      name: "US_RT_Agency_Pages_14d"
      optimization_goal: "OFFSITE_CONVERSIONS"
      bid_strategy: "LOWEST_COST_WITHOUT_CAP"
      countries: ["US"]
      age_min: 18
      age_max: 65
      gender: "All"
      audience: "Visited agency / white-label / agency-pricing pages, last 14 days"
      custom_audiences: ["Agency_Pages_14d"]
      excluded_audiences: ["Customers_All", "Trial_Starters_90d"]
    ads:
      - "Retargeting_Objection_Handler"
      - "Retargeting_Testimonial"   # control

  - name: "Retargeting_Individual_14d"
    objective: "OUTCOME_LEADS"
    budget: 2500
    expected_cpa: 330
    unproven_slot: false
    allow_unproven_without_slot: true
    ad_set:
      name: "US_RT_Trial_Pricing_Pages_14d"
      optimization_goal: "OFFSITE_CONVERSIONS"
      bid_strategy: "LOWEST_COST_WITHOUT_CAP"
      countries: ["US"]
      age_min: 18
      age_max: 65
      gender: "All"
      audience: "Visited trial / pricing / signup pages (not agency pages), last 14 days"
      custom_audiences: ["Trial_Pricing_Pages_14d"]
      excluded_audiences: ["Customers_All", "Trial_Starters_90d", "Agency_Pages_14d"]
    ads:
      - "Retargeting_Pricing_Clarity"
      - "Retargeting_Testimonial"   # control

  - name: "Retargeting_Lapsed_15to30d"
    objective: "OUTCOME_LEADS"
    budget: 1000
    expected_cpa: 330
    unproven_slot: false
    ad_set:
      name: "US_RT_All_Pages_15to30d"
      optimization_goal: "OFFSITE_CONVERSIONS"
      bid_strategy: "LOWEST_COST_WITHOUT_CAP"
      countries: ["US"]
      age_min: 18
      age_max: 65
      gender: "All"
      audience: "Any site visit 15-30 days ago, not seen since"
      custom_audiences: ["Site_Visitors_30d"]
      excluded_audiences: ["Customers_All", "Trial_Starters_90d", "Site_Visitors_14d"]
    ads:
      - "Retargeting_Testimonial"

# ----------------------------------------------------------- Google campaigns
# Every campaign carries its own daily budget. There is no shared budget (F3).
google_campaigns:
  - name: "Search_Brand_US"
    type: "Search"
    budget: 3000                # halved (Vin): brand searchers already know us. Raise only if
                                # search impression share drops below ~80% and a competitor is
                                # on the term. No impression-share data exists in the tabs.
    expected_cpa: 155
    # Maximize Conversions does not accept a CPC cap in Google Ads; the
    # $6,000 monthly budget is the control. Brand volume is supply-limited
    # at 17-19% CTR, so the budget binds before any bid would.
    bid_strategy: "Maximize conversions"
    networks: "Google search"
    locations: ["United States"]
    languages: ["English"]
    ad_groups:
      - name: "Brand_Core"
        keywords:
          - { text: "agentstack", match: "Exact" }
          - { text: "agent stack", match: "Exact" }
          - { text: "agentstack pricing", match: "Phrase" }
          - { text: "agentstack login", match: "Phrase" }
        ads:
          - headlines: ["AgentStack - Official Site", "Ship Production Agents", "Free 14-Day Trial"]
            descriptions: ["Build, deploy and monitor agents in one stack. No card required.", "Start free. Invite your team. Ship this week."]
            path1: "trial"
            path2: ""
    negatives:
      - { text: "free", match: "Negative Phrase" }
      - { text: "jobs", match: "Negative Phrase" }

  - name: "Search_NonBrand_US"
    type: "Search"
    budget: 29000               # +18% on the pre-starvation $811/day (F3/F4)
    expected_cpa: 310
    bid_strategy: "Target CPA"
    target_cpa: 280
    networks: "Google search"
    locations: ["United States"]
    languages: ["English"]
    ad_groups:
      # Split by buyer (Vin): agency vs individual owner carry different LTV and
      # deserve different bids. Campaign tCPA is interim until per-offering
      # values are known; then each ad group gets its own target.
      - name: "Agency_Keywords"
        keywords:
          - { text: "ai agent platform for agencies", match: "Phrase" }
          - { text: "white label ai agents", match: "Phrase" }
          - { text: "agency ai automation platform", match: "Phrase" }
        ads:
          - headlines: ["AI Agents For Your Clients", "White-Label Ready", "Free 14-Day Trial"]
            descriptions: ["Build and run client agents under your brand. One stack, one invoice.", "Start free. No card. Onboard your first client this week."]
            path1: "agencies"
            path2: ""
      - name: "Individual_Owner_Keywords"
        keywords:
          - { text: "ai agent platform", match: "Phrase" }
          - { text: "build ai agents", match: "Phrase" }
          - { text: "agent orchestration tool", match: "Exact" }
          - { text: "deploy ai agents", match: "Phrase" }
        ads:
          - headlines: ["One Platform For AI Agents", "Build, Deploy, Monitor", "Free 14-Day Trial"]
            descriptions: ["Stop gluing six vendors together. One stack for production agents.", "Start free. No card. Your first agent ships this week."]
            path1: "ai-agents"
            path2: "platform"
      - name: "Competitor_Alternatives"
        keywords:
          - { text: "langchain alternative", match: "Phrase" }
          - { text: "crewai alternative", match: "Phrase" }
          - { text: "agent framework comparison", match: "Exact" }
        ads:
          - headlines: ["A Simpler Agent Stack", "Switch In A Weekend", "Free 14-Day Trial"]
            descriptions: ["Migrate off your framework without rewriting your agents.", "See the side-by-side. Start free, no card."]
            path1: "compare"
            path2: ""
    negatives:                  # the 40 negatives from 10-06, extended weekly (F7)
      - { text: "free", match: "Negative Phrase" }
      - { text: "course", match: "Negative Phrase" }
      - { text: "tutorial", match: "Negative Phrase" }
      - { text: "github", match: "Negative Phrase" }
      - { text: "open source", match: "Negative Phrase" }
      - { text: "jobs", match: "Negative Phrase" }
      - { text: "salary", match: "Negative Phrase" }
      - { text: "reddit", match: "Negative Phrase" }

  - name: "PMax_US"
    type: "Performance Max"
    budget: 17000               # flat; tCPA honest about where it is (F4)
    expected_cpa: 330
    bid_strategy: "Target CPA"
    target_cpa: 330
    networks: "All"
    locations: ["United States"]
    languages: ["English"]
    # Dedupe against NonBrand (Vin): brand exclusion list on, search themes
    # limited to category terms NonBrand does not hold on Exact, and the
    # NonBrand negatives mirrored here at campaign level.
    brand_exclusions: ["Search Atlas", "AgentStack"]
    search_themes: ["ai agent monitoring", "agent deployment platform"]
    asset_groups:
      - name: "PMax_US_Core"
        headlines: ["Ship Production AI Agents", "One Stack, Not Six Vendors", "Free 14-Day Trial"]
        long_headline: "Build, deploy and monitor production AI agents in one platform"
        descriptions: ["Start free. No card required. Your first agent ships this week.", "Trusted by agencies and product teams shipping agents in production."]
        business_name: "AgentStack"
    negatives:                  # account-level brand negatives (hypothesis, F7)
      - { text: "agentstack", match: "Negative Phrase" }

  - name: "Search_NonBrand_UK"
    type: "Search"
    budget: 4000                # reinstated (Vin). Own budget. Spends nothing until the
                                # UK tag + PostHog are verified under the consent banner.
    expected_cpa: 330           # placeholder: no UK conversion ever recorded; replaced after 14 days
    bid_strategy: "Maximize conversions"
    networks: "Google search"
    locations: ["United Kingdom"]
    languages: ["English"]
    ad_groups:
      - name: "UK_Agency_Keywords"
        keywords:
          - { text: "ai agent platform for agencies", match: "Phrase" }
          - { text: "white label ai agents", match: "Phrase" }
        ads:
          - headlines: ["AI Agents For Your Clients", "White-Label Ready", "Free 14-Day Trial"]
            descriptions: ["Build and run client agents under your brand. One stack, one invoice.", "Start free. No card. Onboard your first client this week."]
            path1: "agencies"
            path2: ""
      - name: "UK_Individual_Owner_Keywords"
        keywords:
          - { text: "ai agent platform", match: "Phrase" }
          - { text: "build ai agents", match: "Phrase" }
        ads:
          - headlines: ["One Platform For AI Agents", "Build, Deploy, Monitor", "Free 14-Day Trial"]
            descriptions: ["Stop gluing six vendors together. One stack for production agents.", "Start free. No card. Your first agent ships this week."]
            path1: "ai-agents"
            path2: "platform"
    negatives:
      - { text: "free", match: "Negative Phrase" }
      - { text: "course", match: "Negative Phrase" }
      - { text: "tutorial", match: "Negative Phrase" }
      - { text: "jobs", match: "Negative Phrase" }
